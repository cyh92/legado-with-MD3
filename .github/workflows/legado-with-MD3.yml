name: legado-with-MD3 auto release

# 仅手动触发
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versionL: ${{ steps.set-ver.outputs.full_version_name }}
      version: ${{ steps.set-ver.outputs.current_version }}
      build_number: ${{ steps.set-ver.outputs.build_number }}
      commit_number: ${{ steps.set-ver.outputs.commit_number }}
      latest_tag: ${{ steps.set-ver.outputs.last_tag }}
      is_release: ${{ steps.set-ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: set-ver
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          PROP="./app/version.properties"

          MAJOR=$(grep VERSION_MAJOR $PROP | cut -d= -f2 | xargs)
          MINOR=$(grep VERSION_MINOR $PROP | cut -d= -f2 | xargs)
          PATCH=$(grep VERSION_PATCH $PROP | cut -d= -f2 | xargs)
          RELEASE_FLAG=$(grep VERSION_SUFFIX $PROP | cut -d= -f2 | xargs)

          CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
          IS_RELEASE="false"
          BUILD_NUM=0
          VERSION_SUFFIX=""

          if [[ "$RELEASE_FLAG" == "0" ]]; then
            IS_RELEASE="true"
            LAST_TAG=$(git tag --list "$CURRENT_VERSION.*" | grep -v beta | sort -V | tail -n1)
            [ -z "$LAST_TAG" ] && LAST_TAG=$(git tag --sort=-committerdate | head -n1)
          else
            LAST_BETA=$(git tag --list "$CURRENT_VERSION-beta.*" | sort -V | tail -n1)
            [[ "$LAST_BETA" =~ beta\.([0-9]+) ]] && BUILD_NUM=$((${BASH_REMATCH[1]} + 1)) || BUILD_NUM=1
            VERSION_SUFFIX="-beta.$BUILD_NUM"
            LAST_TAG=$(git tag --sort=-committerdate | head -n1)
          fi

          FULL_VERSION="$CURRENT_VERSION$VERSION_SUFFIX"
          LAST_TAG=${LAST_TAG#v}

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "full_version_name=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "commit_number=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      matrix:
        product: [ app ]
        type: ${{ needs.prepare.outputs.is_release == 'true' && '["release"]' || '["release", "noR8"]' }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4

      - name: 签名配置
        run: |
          cp .github/scripts/key-cyh.jks app/legado.jks
          sed '$r .github/scripts/legado.sign' gradle.properties -i

      - name: 构建 APK
        run: |
          TYPE=$(echo ${{ matrix.type }} | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          chmod +x gradlew
          ./gradlew assembleApp$TYPE -PAPP_VERSION_NAME=${{ needs.prepare.outputs.versionL }} -PVERSION_CODE=${{ needs.prepare.outputs.commit_number }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  create_release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with: { name: apks, path: artifacts }

      - name: 重命名 APK
        run: |
          cd artifacts
          for f in *.apk; do
            out="legado-${{ needs.prepare.outputs.versionL }}"
            [[ $f == *noR8* ]] && out+="-noR8"
            [[ $f == *arm64* ]] && out+="-arm64"
            [[ $f == *armeabi* ]] && out+="-arm32"
            mv "$f" "$out.apk"
          done

      - name: 生成更新日志
        id: notes
        run: |
          LOG=$(git log ${{ needs.prepare.outputs.latest_tag }}..HEAD --pretty=format:"* %s" --no-merges)
          [ -z "$LOG" ] && LOG="无更新内容"
          echo "body<<EOF
          ${{ needs.prepare.outputs.is_release != 'true' && '⚠️ 测试版' || '' }}
          ### 更新日志
          $LOG
          EOF" >> $GITHUB_OUTPUT

      - name: 创建 Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.versionL }}
          name: ${{ needs.prepare.outputs.is_release == 'true' && 'Release' || 'Pre-release' }} ${{ needs.prepare.outputs.versionL }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ needs.prepare.outputs.is_release != 'true' }}
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
